<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Altar Servers Admin</title>
  <meta name="theme-color" content="#7a1f2b">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <script>
    /* tweakcn/shadcn dark mode: adds .dark to <html>. Saved choice wins, else follows the device. */
    (function () {
      var mq = matchMedia('(prefers-color-scheme: dark)');
      function saved() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
      window.applyTheme = function () {
        var t = saved(); document.documentElement.classList.toggle('dark', t ? t === 'dark' : mq.matches);
      };
      window.toggleTheme = function () {
        var next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
        try { localStorage.setItem('theme', next); } catch (e) {}
        applyTheme();
      };
      mq.addEventListener && mq.addEventListener('change', applyTheme);
      applyTheme();
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="logged-out">
  <header class="topbar">
    <div class="brand">
      <img src="logo.png" alt="" width="34" height="34">
      <div style="flex:1; min-width:0">
        <h1 id="ministryName">Altar Servers Ministry</h1>
        <p class="sub">Attendance Monitoring System · Admin</p>
      </div>
      <button class="ghost sm theme-toggle" onclick="toggleTheme()" title="Toggle light / dark" aria-label="Toggle light or dark mode">◐</button>
      <div id="userBox" class="row"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="dashboard">Dashboard</button>
      <button data-tab="roster">Roster</button>
      <button data-tab="schedule">Schedule</button>
      <button data-tab="attendance">Attendance</button>
      <button data-tab="approvals">Approvals <span class="badge" id="pendingBadge" hidden></span></button>
      <button data-tab="reports">Monthly Reports</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </header>

  <main id="view"><p class="muted" style="text-align:center; padding:40px">Loading…</p></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
