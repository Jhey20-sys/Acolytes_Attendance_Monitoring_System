# Keeps the Render free-plan site awake by visiting it every 10 minutes
# (Render puts free sites to sleep after 15 minutes without visitors).
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables tab
#        → New repository variable: RENDER_URL = https://your-site.onrender.com
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the site
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::warning::RENDER_URL is not set (Settings → Secrets and variables → Actions → Variables)."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 --retry 2 "${RENDER_URL%/}/api/auth/status")
          echo "Status: $code"
          [ "$code" = "200" ]
